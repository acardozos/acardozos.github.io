{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="wrap footer-row">
    <p class="footer-note">{{ t.footer_note }}</p>
    <p class="mono small">
      <a href="https://github.com/{{ site.github_username }}">{% include icon.html name="github" %} github.com/{{ site.github_username }}</a>
    </p>
    <p class="mono small muted">© {{ site.time | date: "%Y" }} {{ site.author }} · {{ t.made_with }}</p>
  </div>
</footer>
