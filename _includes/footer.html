{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="wrap footer-row">
    <p class="footer-note">{{ t.footer_note }}</p>
    <ul class="footer-links mono small">
      {%- for l in site.data.profile.links -%}
      <li><a href="{{ l.url }}">{% include icon.html name=l.icon %} {{ l.label }}</a></li>
      {%- endfor -%}
    </ul>
    <p class="mono small muted">© {{ site.time | date: "%Y" }} {{ site.author }} · {{ t.made_with }}</p>
  </div>
</footer>
